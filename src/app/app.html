<h1>Consulta</h1>
<div class="main-form-container">
  <div class="form-group">
    <label for="consulta">subir informacion</label>
    <textarea name="consulta" id="consulta" cols="50" rows="5" [(ngModel)]="consulta"></textarea>
  </div>
  <div class="contenedor-boton">
    <button name="button" (click)="enviar()">Enviar</button>
  </div>
  <div class="form-group">
    <label for="resultado">resultado </label>
    <textarea
      name="resultado"
      id="resultado"
      cols="50"
      rows="5"
      [value]="resultado"
      readonly
    ></textarea>
  </div>
</div>
